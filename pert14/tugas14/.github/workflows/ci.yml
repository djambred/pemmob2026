# Contoh CI GitHub Actions untuk TabungKu Cloud.
# Salin ke .github/workflows/ di AKAR repositori proyek Anda dan sesuaikan
# path `working-directory` bila struktur folder berbeda.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check .
      - run: pytest -q --cov

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image produksi
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml build
