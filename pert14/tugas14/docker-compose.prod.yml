# TabungKu Cloud: konfigurasi PRODUKSI.
#   cp .env.example .env    (lalu ganti SEMUA password dan kunci!)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Bedanya dengan docker-compose.yml (pengembangan):
# - hanya Nginx yang membuka port (80); MySQL, API, admin tidak terekspos;
# - tanpa bind mount kode dan tanpa auto-reload;
# - APP_ENV=production: /docs mati, Laravel tanpa debug, cache diaktifkan;
# - tanpa Adminer.
name: tabungku-prod

services:
  mysql:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    restart: always
    user: app
    environment:
      APP_ENV: production
      API_WORKERS: ${API_WORKERS:-2}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_MENIT: ${ACCESS_TOKEN_MENIT:-15}
      REFRESH_TOKEN_HARI: ${REFRESH_TOKEN_HARI:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TZ: Asia/Jakarta
    volumes:
      - uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  admin:
    build:
      context: ./admin
      args:
        COMPOSER_NO_DEV: "1"
    restart: always
    environment:
      APP_NAME: "TabungKu Admin"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${ADMIN_APP_KEY}
      APP_URL: ${PUBLIC_URL}
      APP_LOCALE: id
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      API_PUBLIC_URL: ${PUBLIC_URL}/api
      TZ: Asia/Jakarta
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:1.29-alpine
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy

volumes:
  mysql_data:
  uploads:
