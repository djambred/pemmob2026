# TabungKu Cloud: semua layanan backend dijalankan dengan satu perintah:
#   cp .env.example .env
#   docker compose up -d --build
name: tabungku

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Jakarta
    ports:
      - "3307:3306" # 3307 di laptop agar tidak bentrok dengan MySQL/XAMPP lokal
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_MENIT: ${ACCESS_TOKEN_MENIT:-15}
      REFRESH_TOKEN_HARI: ${REFRESH_TOKEN_HARI:-7}
      TZ: Asia/Jakarta
    ports:
      - "8000:8000"
    volumes:
      # Seluruh folder backend dipasang ke container: perubahan kode langsung
      # dipakai (auto-reload) dan berkas migrasi baru muncul di laptop.
      - ./backend:/code
    depends_on:
      mysql:
        condition: service_healthy
    # Dipakai service admin untuk menunggu migrasi Alembic selesai.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Dashboard admin: http://localhost:8080/admin
  admin:
    build: ./admin
    restart: unless-stopped
    environment:
      APP_NAME: "TabungKu Admin"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${ADMIN_APP_KEY}
      APP_URL: http://localhost:8080
      APP_LOCALE: id
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TZ: Asia/Jakarta
    ports:
      - "8080:8080"
    volumes:
      - ./admin:/app # kode Laravel di laptop langsung dipakai container
      - /app/vendor # vendor tetap dari image (tidak tertimpa folder laptop)
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_healthy

  # Antarmuka web untuk melihat isi database: http://localhost:8081
  # Server: mysql, user/password sesuai .env
  adminer:
    image: adminer:5
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
