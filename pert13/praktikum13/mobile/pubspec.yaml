name: tabungku
description: "TabungKu Cloud: to-do list + keuangan dengan backend FastAPI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4+1
  path: ^1.9.1
  shared_preferences: ^2.5.6
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
